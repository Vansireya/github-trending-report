<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="每日 GitHub Trending 中文技术雷达。">
  <script>
    if (/\/src\/templates\/base\.html$/.test(window.location.pathname)) {
      window.location.replace(new URL('../../', window.location.href));
    }
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23d94a78'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='Arial' font-size='23' font-weight='700' fill='white'%3EGR%3C/text%3E%3C/svg%3E">
  <title>{{TITLE}}</title>
  <script src="{{RANKING_DATA_PATH}}"></script>
  <link rel="stylesheet" href="{{STYLESHEET_PATH}}">
</head>
<body data-report-base-path="{{REPORT_BASE_PATH}}" data-report-date="{{REPORT_DATE}}">
  <div class="page-glow page-glow--one"></div>
  <div class="page-glow page-glow--two"></div>

  <header class="site-header">
    <a class="brand" href="{{REPORT_BASE_PATH}}../" aria-label="GitHub Radar 首页">
      <span class="brand-mark">GR</span>
      <span><strong>GitHub Radar</strong><small>YOUR OPEN SOURCE BRIEF</small></span>
    </a>
    <div class="header-actions">
      <span class="live-indicator"><i></i>每日更新</span>
      <button class="library-button" id="libraryOpen" type="button" aria-label="打开我的收藏" aria-haspopup="dialog" aria-controls="libraryDrawer">
        <span aria-hidden="true">♡</span><span>我的收藏</span><strong id="libraryCount">0</strong>
      </button>
      <button class="icon-button" id="themeToggle" type="button" aria-label="切换深浅主题" title="切换主题">◐</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-copy">
        <div class="hero-meta">
          <span class="eyebrow hero-eyebrow">你的每日开源简报</span>
          <div class="hero-date"><span>最新一期</span><strong>{{DATE_CN}}</strong></div>
        </div>
        <h1>{{REPORT_HEADLINE}}</h1>
        <p>{{REPORT_OPENING}}</p>
      </div>
    </section>

    <section class="dashboard">
      <div class="feed-column">
        <div class="content" id="projectFeed">{{CONTENT}}</div>
      </div>

      <aside class="rail">
        <section class="rail-panel ranking-panel">
          <div class="panel-heading"><h2>热度榜</h2></div>
          <div class="segmented-control" role="group" aria-label="排行榜周期">
            <button type="button" class="active" data-range="week" aria-pressed="true">7 天</button>
            <button type="button" data-range="month" aria-pressed="false">30 天</button>
            <button type="button" data-range="quarter" aria-pressed="false">季度</button>
          </div>
          <ol class="ranking-list" id="rankingList"><li>加载中…</li></ol>
        </section>

        <section class="rail-panel history-panel">
          <div class="panel-heading"><div><span class="eyebrow">随机回顾</span><h2>随便翻一天</h2></div></div>
          <p class="history-intro">从保留的近 30 天简报里，随机抽一份旧信号。</p>
          <button class="random-history-button" id="randomHistoryButton" type="button">
            <span class="random-history-icon" aria-hidden="true">↝</span>
            <span><strong>随机抽取一份简报</strong><small id="randomHistoryDate">今天会翻到哪一天？</small></span>
          </button>
          <details class="date-picker-details">
            <summary>按日期查找</summary>
            {{DATE_SELECTOR_HTML}}
          </details>
        </section>
        <p class="rail-note">榜单是发现信号，不代表质量或安全背书。使用项目前请阅读仓库文档。</p>
      </aside>
    </section>
  </main>

  <footer class="site-footer">
    <span>GitHub Radar · 自动生成的开源趋势观察</span>
    <a href="https://github.com/Vansireya/github-trending-report" target="_blank" rel="noopener noreferrer">查看源码 ↗</a>
  </footer>

  <div class="library-overlay" id="libraryOverlay" hidden>
    <aside class="library-drawer" id="libraryDrawer" role="dialog" aria-modal="true" aria-labelledby="libraryTitle">
      <div class="library-header">
        <div><span class="eyebrow">我的收藏</span><h2 id="libraryTitle">我的项目库</h2></div>
        <button class="icon-button" id="libraryClose" type="button" aria-label="关闭项目库">×</button>
      </div>
      <div class="library-tabs" role="tablist" aria-label="项目库分类">
        <button type="button" role="tab" data-library-tab="favorites" aria-selected="true">收藏 <span id="favoriteTabCount">0</span></button>
      </div>
      <div class="library-list" id="libraryList"></div>
      <button class="library-export" id="libraryExport" type="button">导出当前列表为 Markdown</button>
    </aside>
  </div>
  <script src="{{SCRIPT_PATH}}"></script>
</body>
</html>
