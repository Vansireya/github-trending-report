name: 🌟 Daily GitHub Trending Report

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间早上 8 点运行
  workflow_dispatch:   # 允许你手动点击按钮测试

concurrency:
  group: daily-github-trending-report
  cancel-in-progress: false

permissions:
  contents: write 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史，避免 pull 冲突

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm ci

      - name: 运行生成脚本
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://api.deepseek.com
          OPENAI_MODEL: deepseek-chat
        run: npm start

      - name: 提交并推送到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 1. 核心改进：使用 "." 包含所有变动（防止漏掉 package-lock.json 等文件）
          git add .
          
          # 2. 提交到机器人本地
          git commit -m "auto: 🌟 自动生成今日简报并更新首页 [skip ci]" || echo "没有变化"
          
          # 3. 此时本地是干净的，可以放心地拉取远程改动并合并
          git pull origin main --rebase
          
          # 4. 推送到远程
          git push origin main
